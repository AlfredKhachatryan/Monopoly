<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The Board and the Login page are dark. The phone Client is the only
         light surface, and it swaps this value for its own --ground while it is
         mounted (see useClientChrome in src/Client/ClientScreen.jsx). -->
    <meta name="theme-color" content="#191528" />
    <meta
      name="description"
      content="Multiplayer Monopoly board game. One screen shows the board, each player plays from their phone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geologica:wght@400;600;700&family=Manrope:wght@400..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>Monopoly</title>
    <!-- Theme, before the first paint (spec §10).
         src/Hooks/useTheme.js owns this preference; this is the same three
         lines run early enough to matter. A render-blocking script in <head>
         runs before the body is laid out, so <html data-theme> is already in
         place when styles/tokens.css is first applied and nobody sees a white
         flash on the way into a dark game, or the reverse.
         "system" is stored as the ABSENCE of the key and applied as the
         ABSENCE of the attribute, so the prefers-color-scheme media queries
         stay in charge unless somebody has actually chosen. Wrapped, because
         Safari in private mode throws on localStorage.getItem. -->
    <script>
      try {
        var t = localStorage.getItem("monopoly.theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
